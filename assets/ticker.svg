    18% { opacity: 1; transform: translateY(0); }
    20% { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; }
  }
  .cursor { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
